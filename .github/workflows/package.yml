# Build the pacman package on both architectures we claim to support.
#
# aarch64 is the reason this exists. The ARM work is real -- the screenshare plugin
# vendors funchook so Hyprland plugin hooking works there at all -- but it was only ever
# exercised by being physically sat at the Apple silicon machine. A push that breaks the
# ARM build was previously discoverable only by going and finding out.
#
# Both jobs run on NATIVE runners, not QEMU: arm64 hosted runners are free for public
# repositories, and this repository is public. A cross build under emulation would take
# roughly an order of magnitude longer and would not exercise the same compiler.
#
# SECURITY POSTURE, since a build pipeline is a supply chain:
#
#   * The trigger is `pull_request`, never `pull_request_target`. A fork's pull request
#     builds that fork's code -- which for a package build means running arbitrary code
#     by design -- so it must run with no secrets and a read-only token. Using
#     pull_request_target here would hand write scope to unreviewed code.
#   * No `${{ }}` interpolation appears inside any `run:` block except values that come
#     from this file. Anything attacker-influenced (a branch name, a tag, a PR title)
#     reaches the shell only as a quoted environment variable, so it cannot end the
#     current command and start another.
#   * Permissions are declared per job and default to none. Only the release job gets
#     `contents: write`, and only on a tag.
#   * Third-party actions are pinned to a full commit SHA. A tag is a mutable pointer:
#     whoever can move `v4` can run code in every workflow that trusts it.
#   * `persist-credentials: false`, because the build job never pushes. Otherwise
#     checkout leaves the token in .git/config, inside the very tree whose build scripts
#     we then execute.
#   * The build user has no sudoers grant. (base-devel ships the sudo binary; builder
#     has a locked password and no rule, so it is unusable.) Every dependency is
#     installed as root beforehand and makepkg runs with --nodeps, so the step that
#     executes repository code needs no privilege at all -- and every step AFTER it
#     drops back to that user, so nothing root-owned ever parses its output.
name: package

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Default to nothing; each job opts in to exactly what it needs.
permissions: {}

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    permissions:
      contents: read
    strategy:
      # Never let one architecture's failure hide the other's result: which of the two
      # broke is the single most useful thing this workflow reports.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6
          # Arch proper publishes no ARM image; Arch Linux ARM is a separate distribution
          # with the same package names. menci/archlinuxarm is the one that is actually
          # maintained -- it rebuilds daily and publishes a real arm64 manifest.
          #
          # Both images are pinned BY DIGEST, and the reason is not the one you would
          # expect. `pacman -Syu` replaces the package set in the first minute, so a pin
          # freezes almost nothing about what gets built -- but the image also carries
          # the pacman KEYRING, which is the thing that makes the mirrors' signatures
          # mean anything at all. On a tag, whatever that keyring trusts becomes a
          # published release. Pinning makes "what base built v0.1.0" an explicit,
          # reviewable change instead of whatever the registry served that minute.
          #
          # Cost: these go stale, and nothing here bumps them. Re-pin when you want the
          # newer base -- `docker buildx imagetools inspect <image>:base-devel` prints
          # the current digest.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:base-devel@sha256:68b3b9434a41b92d80b66a384034d73d5598771ed175bead99ae7c380905c964

    steps:
      - name: Install toolchain and test dependencies
        run: |
          set -euxo pipefail
          # Required. ffmpeg, the Qt6 QML tooling and pytest are not needed to BUILD --
          # they are here so check() actually runs instead of skipping. 22 test files
          # gate on ffmpeg and the QML suites gate on qmltestrunner, so without them a
          # green check has verified almost nothing while reading exactly the same.
          # --disable-sandbox: pacman 7 confines its download phase with Landlock and a
          # separate `alpm` user, and neither is grantable inside an Actions job
          # container -- the ARM leg died on "the Landlock ruleset could not be applied".
          # This does NOT weaken the trust chain: signature verification is a separate
          # mechanism and stays on, so packages are still rejected unless signed by a key
          # the image's keyring trusts. What is given up is defence-in-depth around the
          # downloader, in a container that is destroyed at the end of the job. The
          # alternative -- handing the container extra kernel privileges so the sandbox
          # can be built -- would be strictly worse.
          pacman -Syu --noconfirm --needed --disable-sandbox \
            git base-devel pkgconf \
            wayland wayland-protocols mesa \
            python python-pytest \
            ffmpeg qt6-declarative qt6-multimedia

          # Best effort, in its own call. The drawtext tests gate on one exact font file
          # and skip without it, so its absence costs a little coverage and nothing else.
          # pacman fails the WHOLE transaction on an unknown package name, though, and
          # this is an `any` package coming from a different distribution's mirrors on
          # the ARM leg -- so asking for it above would let a missing font break the
          # build it cannot actually affect.
          pacman -S --noconfirm --needed --disable-sandbox ttf-jetbrains-mono-nerd \
            || echo "::warning::JetBrains Mono Nerd Font unavailable; drawtext tests will skip"

          # Say which way it went, so a jump in the skip count has a reason on the page
          # rather than sending someone back into the logs to work it out.
          test -f /usr/share/fonts/TTF/JetBrainsMonoNerdFont-Regular.ttf \
            && echo "drawtext tests: font present" \
            || echo "::warning::drawtext tests will skip: font not installed"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # makepkg resolves the source below to a commit, which a depth-1 clone may not
          # contain once this is a merge commit or a tag build.
          fetch-depth: 0
          # This job executes the tree's own build scripts. Do not leave a credential in
          # it for them to find.
          persist-credentials: false

      - name: Build the package
        env:
          # Via the environment, not `${{ }}` in the script: GITHUB_SHA is trustworthy
          # but the habit is what keeps the one that is not out of the shell.
          COMMIT: ${{ github.sha }}
        run: |
          set -euxo pipefail
          # The container is root and makepkg refuses to run as root. runuser drops to an
          # unprivileged user directly -- no sudo, no sudoers entry, nothing that would
          # let the code being built climb back out.
          useradd -m builder

          # The workflow-command files are how a step talks to the runner: anything
          # written to $GITHUB_ENV becomes an environment variable in the NEXT step. A
          # build that could append to them could set BASH_ENV and have the runner
          # execute it -- as root, outside the container's build user. They are created
          # on the host and should not be builder-writable, but "should not" is resting
          # on a uid coincidence, so say it explicitly.
          chmod go-w /github/file_commands /github/file_commands/* 2>/dev/null || true

          install -d -o builder /tmp/build
          install -o builder packaging/PKGBUILD /tmp/build/PKGBUILD

          # Both users have to agree the checkout is safe to read: root cloned it,
          # builder reads it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          runuser -u builder -- git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Build THIS commit, not the release tag the PKGBUILD names. Otherwise every
          # run would rebuild the last release and a pull request would test nothing it
          # changed. Releases still build the tag, because the tag is this commit.
          runuser -u builder -- \
            sed -i "s|^source=.*|source=(\"git+file://${GITHUB_WORKSPACE}#commit=${COMMIT}\")|" \
            /tmp/build/PKGBUILD

          # Verify the rewrite landed. `^source=.*` is a single-line substitution: if
          # source= ever becomes a multi-line array, this would quietly leave the tail
          # behind and build the last release tag instead of this commit -- a green run
          # that tested nothing it was asked to.
          grep -q '^source=("git+file://' /tmp/build/PKGBUILD

          # Everything from here runs as builder. --nodeps because the RUNTIME
          # dependencies are deliberately not installable here: omarchy lives in a
          # third-party repo that serves x86_64 only, and none of hyprland, mpv or
          # gpu-screen-recorder is needed to compile or to test. The build and check
          # dependencies were installed explicitly above, so this skips only what it
          # should.
          cd /tmp/build
          runuser -u builder -- makepkg --nodeps --noconfirm

          # Ask makepkg where it put things instead of guessing. Both PKGDEST (where)
          # and PKGEXT (which compressor) are makepkg.conf settings, and the two
          # distributions do not agree: Arch Linux ARM produced no -debug package at all,
          # so a glob written against what Arch does found nothing here and the step
          # failed on a build that had just passed 925 tests. --packagelist prints the
          # full resolved paths and is the only answer that cannot drift.
          install -d -o builder /tmp/out
          runuser -u builder -- makepkg --packagelist >/tmp/pkglist
          cat /tmp/pkglist
          runuser -u builder -- sh -c 'while IFS= read -r p; do cp "$p" /tmp/out/; done < /tmp/pkglist'

      - name: Show what was built
        run: |
          set -eux
          ls -lh /tmp/out/

          # Exactly the package, never the -debug one makepkg may also emit. Selecting it
          # by name mattered: bsdtar reads a second filename as a MEMBER to list inside
          # the first archive, so a glob matching both reported "Not found in archive"
          # and the step concluded the recorder was missing from a package that in fact
          # contained it. A verification step that fails on a good build is worse than
          # none, because it teaches you to ignore it.
          pkg=/tmp/out/$(basename "$(grep -v -- '-debug-' /tmp/pkglist | head -1)")
          test -f "$pkg"
          # Prove the native recorder is actually in there. It is optional by design and
          # build() only warns when it fails, so a silently recorder-less package would
          # otherwise ship looking identical.
          #
          # As builder, not root: this parses an archive the previous step's code just
          # produced, and libarchive is the wrong thing to point at hostile input from
          # the privileged side of the only boundary this job has.
          runuser -u builder -- bsdtar -tf "$pkg" \
            | grep -q 'contrib/omarchy-capture-window/omarchy-capture-window' \
            || { echo "::error::the native window recorder is missing from the package"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omarchy-studio-${{ matrix.arch }}
          path: /tmp/out/*
          if-no-files-found: error

  parity:
    # The preview-vs-export checks, which the package build cannot run.
    #
    # tests/test_parity.py renders frames through QML and compares them pixel-wise
    # against the ffmpeg export -- the only thing that catches the editor and the
    # renderer disagreeing, which is the defect a user actually sees. It gates on
    # WAYLAND_DISPLAY/DISPLAY because a VideoOutput grabs EMPTY under every headless Qt
    # platform, so in the build job it quietly skips: every green run of this workflow
    # was green partly because these never ran.
    #
    # Weston's headless backend is a real Wayland compositor with no GPU and no DRM
    # device, which is exactly the missing piece. Rendering falls to llvmpipe and
    # decoding to ffmpeg in software -- slow, and correct, which is the trade this job
    # wants.
    name: parity
    runs-on: ubuntu-latest
    container: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6
    permissions:
      contents: read
    steps:
      - name: Install a compositor and the video stack
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm --needed --disable-sandbox \
            git python python-pytest ffmpeg mesa \
            qt6-declarative qt6-multimedia qt6-multimedia-ffmpeg qt6-wayland \
            weston ttf-jetbrains-mono-nerd
          # qt6-multimedia-ffmpeg by name: qt6-multimedia depends on the VIRTUAL
          # qt6-multimedia-backend, and letting pacman pick can land the gstreamer
          # provider, whose behaviour here is not what upstream develops against.

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run the parity suite under weston
        env:
          QT_QPA_PLATFORM: wayland
        run: |
          set -euxo pipefail
          # Weston refuses to run as root, and the tests launch the real editor, so give
          # both an ordinary user with its own runtime dir.
          useradd -m runner
          install -d -m 0700 -o runner /run/user/1001
          chown -R runner "$GITHUB_WORKSPACE"

          runuser -u runner -- env XDG_RUNTIME_DIR=/run/user/1001 \
            weston --backend=headless --socket=wayland-ci --idle-time=0 \
            >/tmp/weston.log 2>&1 &

          # Wait for the socket rather than sleeping: weston takes well under a second
          # here, but "well under a second" is what the bug this job exists to catch was
          # also built on.
          for _ in $(seq 1 100); do
            [ -S /run/user/1001/wayland-ci ] && break
            sleep 0.1
          done
          test -S /run/user/1001/wayland-ci || { echo "::error::weston did not start"; cat /tmp/weston.log; exit 1; }

          runuser -u runner -- env \
            XDG_RUNTIME_DIR=/run/user/1001 \
            WAYLAND_DISPLAY=wayland-ci \
            QT_QPA_PLATFORM=wayland \
            OMARCHY_STUDIO_NO_REVEAL=1 \
            python -m pytest -q tests/test_parity.py

      - name: Weston log
        if: always()
        run: cat /tmp/weston.log || true

  release:
    name: attach to release
    needs: build
    # Tags only, and only on this repository. A fork's tag would upload to the fork's
    # own release rather than ours regardless -- its token is its own -- but the comment
    # claimed a check that was not written, so write it.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'the2dl/omarchy-studio'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eux
          ls -lh dist/
          # Create on the first run, add to it on a re-run. Quoted env vars throughout:
          # a tag name is attacker-controlled on a fork.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          fi
          # dist/*, not dist/*.pkg.tar.zst: Arch compresses with zstd and Arch Linux ARM
          # with xz, so naming one extension would have published the x86_64 package and
          # silently dropped the aarch64 one -- on a release, where nobody is watching a
          # log. The artifacts contain nothing but packages.
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
